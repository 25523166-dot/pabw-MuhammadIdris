<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Demo</title>
  
  <!-- 1. Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Your HTML with Bootstrap classes goes here -->
  <div class="container text-center my-5">
    <h1 class="text-primary">Hello, Bootstrap!</h1>
    <p class="lead">This layout is fully responsive and styled out of the box.</p>
    <a href="#" class="btn btn-success btn-lg">Click Me</a>
  </div>

<div class="container mt-4">
  <div class="row">
    <div class="col-md-6">
      <h2>Left Column</h2>
      <p>This will take full width on mobile, and 50% width on desktop screens.</p>
    </div>
    <div class="col-md-6">
      <h2>Right Column</h2>
      <p>Bootstrap automatically shifts these stacked or side-by-side based on screen size.</p>
    </div>
  </div>
</div>

  <!-- 2. Bootstrap JS Bundle CDN (for dropdowns, modals, tabs, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
