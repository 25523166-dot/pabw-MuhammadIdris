<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing</title>
</head>
<body>
    <header>
        <h1>My website</h1>
        <nav aria-label="Main">
            <ul>
                <li><a href="profil.html">Profil</a></li>
                <li><a href="halaman.html">Halaman</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="profil">
            <h2>Profil</h2>
                <table>
                    <caption>Judul tabel Anda</caption>
                    <thead>
                        <tr>
                        <th scope="col">Kolom 1</th>
                        <th scope="col">Kolom 2</th>
                        <th scope="col">Kolom 3</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                        <th scope="row">
                            <figure>
                            <img src="assets/image1.jpg"
                                alt="Foto profil"
                                width="250" loading="lazy">
                            <figcaption>Foto Profil Lama</figcaption>
                            </figure>
                        </th>
                        <td>Isi</td>
                        <td>Isi</td>
                        </tr>
                        <tr>
                        <th scope="row">Baris 2</th>
                        <td>Isi</td>
                        <td>Isi</td>
                        </tr>
                        <tr>
                        <th scope="row">Baris 3</th>
                        <td>Isi</td>
                        <td>Isi</td>
                        </tr>
                    </tbody>
                    </table>


            <p>Ini adalah halaman profil saya.</p>
        </section>

        <section id="Halaman">
        <h2>Judul bagian kedua</h2>
        
        <form action="/simpan" method="post">
            <p>
            <label for="nama-kolom">Keterangan kolom</label>
            <input type="text" id="nama-kolom" name="nama-kolom" required>
            </p>
            <p>
            <label for="email-kolom">Email</label>
            <input type="email" id="email-kolom" name="email-kolom" required>
            </p>
            <p>
            <label for="pesan-kolom">Pesan</label>
            <textarea id="pesan-kolom" name="pesan-kolom" rows="4" cols="50" required></textarea>
            </p>
            <button type="submit">Simpan</button>
        </form>
        </section>

    </main>
    
    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>
</body>
</html>
