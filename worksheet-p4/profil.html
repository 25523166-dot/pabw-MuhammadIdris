<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Collection</title>

    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="komponen.css">
    <link rel="stylesheet" href="tema.css">

</head>
<body>
    <header>
        <h1>Game Collection</h1>
        <nav aria-label="Main">
            <ul>
                <li><a href="#list">Games List</a></li>
                <li><a href="#halaman">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="list">
            <h2>Games List on Steam</h2>
                <table>
                    <caption>List of Games</caption>
                    <thead>
                        <tr>
                        <th scope="col">Games</th>
                        <th scope="col">Time Spent</th>
                        <th scope="col">Rating</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                        <th scope="row">
                            <figure>
                            <img src="assets/wuwa-pic.jpg"
                                alt="Wuthering Waves"
                                width="500" loading="lazy">
                            <figcaption>Wuthering Waves</figcaption>
                            </figure>
                        </th>
                        <td>281.7h</td>
                        <td>86.00%</td>
                        </tr>
                        <tr>
                        <th scope="row">
                            <figure>
                            <img src="assets/acOdyssey-pic.jpg"
                                alt="Assassin's Creed Odyssey"
                                width="500" loading="lazy">
                            <figcaption>Assassin's Creed Odyssey</figcaption>
                            </figure>
                        </th>
                        <td>135.5h</td>
                        <td>87.70%</td>
                        </tr>
                        <tr>
                        <th scope="row">
                            <figure>
                            <img src="assets/nfsHeat-pic.jpg"
                                alt="Need for Speed Heat"
                                width="500" loading="lazy">
                            <figcaption>Need for Speed Heat</figcaption>
                            </figure>
                        </th>
                        <td>47.5h</td>
                        <td>83.32%</td>
                        </tr>
                    </tbody>
                    </table>


            <p>This is my game list page.</p>
        </section>

        <section id="halaman">
        <h2>Contact</h2>
        
        <form action="/simpan" method="post">
            <p>
            <label for="nama-kolom">Column Description</label>
            <input type="text" id="nama-kolom" name="nama-kolom" required>
            </p>
            <p>
            <label for="email-kolom">Email</label>
            <input type="email" id="email-kolom" name="email-kolom" required>
            </p>
            <p>
            <label for="pesan-kolom">Message</label>
            <textarea id="pesan-kolom" name="pesan-kolom" rows="4" cols="50" required></textarea>
            </p>
            <button type="submit">Simpan</button>
        </form>
        </section>

    </main>
    
    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>
</body>
</html>
